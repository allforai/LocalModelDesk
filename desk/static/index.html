<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalModelDesk</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header id="statusbar" data-tone="ok"><span class="status-part status-mem" data-mem>—</span><span class="status-part status-holder" data-holder>—</span><span class="status-part status-media" data-media>—</span><span class="status-part status-next" data-next>—</span><button data-open-settings>设置</button></header>
  <nav id="tabs"><button data-tab="chat" class="active">聊天</button><button data-tab="video">视频</button><button data-tab="music">音乐</button><button data-tab="resources">资源</button><button data-tab="library">素材库</button></nav>
  <main>
    <section id="pane-chat" data-pane="chat"><aside class="sessions"><button data-session-new>新会话</button><ul data-session-list></ul></aside><div class="chat-main"><div class="model-row"><select data-model-select></select><button data-load>加载</button><button data-unload>卸载</button><span data-model-state data-status="idle">未加载</span></div><div class="messages" data-messages></div><p class="inline-error" data-chat-error></p><div class="composer"><textarea data-chat-input placeholder="输入消息，⌘Enter 发送"></textarea><button data-send>发送</button></div></div></section>
    <section id="pane-video" data-pane="video" hidden><div class="form"><textarea data-video-prompt placeholder="视频提示词（含环境声描述）"></textarea><label>画幅 <select data-video-size></select></label><label>帧数 <input data-video-frames type="number" value="49" min="9" step="8"></label><label>步数 <input data-video-steps type="number" value="16" min="4" max="50"></label><button data-video-start>生成视频</button><p class="inline-error" data-video-error></p></div><div class="job"><p data-job-status>空闲</p><button data-job-cancel hidden>取消</button><pre data-job-log></pre><p class="inline-error" data-job-error></p><div data-job-player></div></div></section>
    <section id="pane-music" data-pane="music" hidden><div class="form"><textarea data-music-caption placeholder="风格描述"></textarea><textarea data-music-lyrics placeholder="歌词"></textarea><label>时长（秒） <input data-music-duration type="number" value="60" min="10" max="300"></label><button data-music-start>生成歌曲</button><p class="inline-error" data-music-error></p></div><div class="job"><p data-job-status>空闲</p><button data-job-cancel hidden>取消</button><pre data-job-log></pre><p class="inline-error" data-job-error></p><div data-job-player></div></div></section>
    <section id="pane-resources" data-pane="resources" hidden><div class="res-head"><span data-res-disk></span><button data-res-refresh>重新校验</button></div><p class="inline-error" data-res-error></p><ul data-res-list></ul></section>
    <section id="pane-library" data-pane="library" hidden><button data-lib-refresh>刷新</button><p class="inline-error" data-lib-error></p><div data-lib-player></div><ul data-lib-list></ul></section>
  </main>
  <section id="pane-firstrun" hidden><h1>LocalModelDesk 首次运行</h1><fieldset><legend>选择 models 目录</legend><input data-fr-models-root><button data-fr-complete>使用该目录</button></fieldset><fieldset><legend>收编既有目录树</legend><input data-fr-legacy placeholder="/path/to/existing/models"><label><input type="radio" name="fr-mode" value="point" checked>指向：原地使用旧目录</label><label><input type="radio" name="fr-mode" value="move">移动：搬进新的 models 根</label><button data-fr-adopt>收编</button></fieldset><p class="inline-error" data-fr-error></p></section>
  <aside id="pane-settings" hidden><h2>设置 · 对外 API</h2><label><input type="checkbox" data-settings-enabled> 开启对外接口</label><label>主机 <input data-settings-host></label><label>端口 <input data-settings-port type="number" min="1" max="65535"></label><button data-settings-save>保存并应用</button><p data-settings-listening></p><p data-settings-auth-warning class="warn"></p><p>OpenAI base URL</p><code data-settings-openai-url></code><button data-settings-copy-openai>复制</button><p>Anthropic base URL</p><code data-settings-anthropic-url></code><button data-settings-copy-anthropic>复制</button><p data-settings-lan-note></p><p class="inline-error" data-settings-error></p><button data-close-settings>关闭</button></aside>
  <p id="fatal" hidden></p>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
